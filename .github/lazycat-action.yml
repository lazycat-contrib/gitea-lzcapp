version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: gitea

build:
  toolchains: []
  run_buildscript: false

images:
  - id: gitea
    target: service
    service: gitea
    source: docker.io/gitea/gitea
    channel: stable
    sort: semver
    tag_regex: '^1\.\d+\.\d+$'
    max_tags: 50000
    max_matching_tags: 50000
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Gitea
    summary: 轻量级自托管 Git 服务
